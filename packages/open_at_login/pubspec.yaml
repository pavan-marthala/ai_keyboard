name: open_at_login
description: A Flutter package to enable or disable launching a desktop application automatically at user login.
version: 0.0.1
homepage: https://github.com/pavan-marthala/ai_keyboard/tree/master/packages/open_at_login
repository: https://github.com/pavan-marthala/ai_keyboard/tree/master/packages/open_at_login
issue_tracker: https://github.com/pavan-marthala/ai_keyboard/issues

topics:
  - macos
  - launch-at-login
  - startup
  - login
  - desktop

platforms:
  macos:
  windows:

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      windows:
        pluginClass: OpenAtLoginPluginCApi

